on:
  workflow_call:
    secrets:
      db_password:
        required: true
    inputs:
      health_check_endpoint:
        required: false
        type: string
        default: http://localhost:3000/health
      smoke_test_wait:
        required: false
        type: number
        default: 4
      smoke_test_server:
        required: false
        type: string
        default: localhost:3000

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Install dependencies
        run: composer install --no-ansi --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-ast
      - name: Run smoke test
        run: composer ci:test:smoke
        env:
          ENVIRONMENT: test
          SMOKE_TEST_WAIT: ${{ inputs.smoke_test_wait }}
          SMOKE_TEST_SERVER: ${{ inputs.smoke_test_server }}
          HEALTH_CHECK_ENDPOINT: ${{ inputs.health_check_endpoint }}
          DB_PASSWORD: ${{ secrets.db_password }}
